name: Motion sandbox verification

on:
  pull_request:
    paths:
      - "services/video-worker/**"
      - "src/domain/motion/**"
      - "scripts/sync-motion-domain.mjs"
      - ".github/workflows/motion-sandbox.yml"
  push:
    branches: [main]
    paths:
      - "services/video-worker/**"
      - "src/domain/motion/**"
      - "scripts/sync-motion-domain.mjs"
      - ".github/workflows/motion-sandbox.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux-sandbox:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: services/video-worker/package-lock.json
      - run: npm ci --no-audit --no-fund
        working-directory: services/video-worker
      - run: npm run typecheck && npm run build
        working-directory: services/video-worker
      - name: Build credential-free Chromium renderer
        run: docker build -f services/video-worker/Dockerfile.motion -t vidrial-motion-renderer:ci .
      - name: Install the matching browser for authored API isolation fixtures
        working-directory: services/video-worker
        run: |
          npx playwright-core install --with-deps chromium
          node --input-type=module -e "import { chromium } from 'playwright-core'; console.log('MOTION_TEST_CHROMIUM_PATH='+chromium.executablePath())" >> "$GITHUB_ENV"
      - name: Verify actual Linux isolation and rendering
        run: npm run test:motion
        working-directory: services/video-worker
        env:
          MOTION_DOCKER_TEST_IMAGE: vidrial-motion-renderer:ci
          MOTION_TEST_SECCOMP_PROFILE: ${{ github.workspace }}/services/video-worker/motion-seccomp.json
      - name: Verify production startup gate with synthetic configuration
        run: node scripts/check-motion-host.mjs
        working-directory: services/video-worker
        env:
          SUPABASE_URL: https://example.invalid
          SUPABASE_SERVICE_ROLE_KEY: ci-placeholder-not-a-real-credential
          WORKER_TEMP_ROOT: /tmp/vidrial-motion-ci
          MOTION_SANDBOX_IMAGE: vidrial-motion-renderer:ci
          MOTION_SECCOMP_PROFILE: ${{ github.workspace }}/services/video-worker/motion-seccomp.json
      - name: Record image footprint
        run: docker image inspect vidrial-motion-renderer:ci --format 'Image bytes={{.Size}}'
