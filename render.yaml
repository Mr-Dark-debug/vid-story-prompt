services:
  - type: web
    name: vidrial-cobalt
    runtime: docker
    plan: free
    region: frankfurt
    branch: main
    dockerfilePath: ./services/cobalt/Dockerfile
    dockerContext: ./services/cobalt
    healthCheckPath: /
    envVars:
      - key: API_URL
        fromService:
          type: web
          name: vidrial-cobalt
          envVarKey: RENDER_EXTERNAL_URL
      - key: API_PORT
        value: "9000"
      - key: API_LISTEN_ADDRESS
        value: 0.0.0.0
      - key: COBALT_API_KEY
        sync: false
      - key: CORS_WILDCARD
        value: "0"
      - key: CORS_URL
        value: https://vidrial.vercel.app
      - key: DURATION_LIMIT
        value: "21600"
      - key: RATELIMIT_MAX
        value: "20"
      - key: TUNNEL_RATELIMIT_MAX
        value: "40"

  - type: web
    name: vidrial-video-worker
    runtime: docker
    plan: free
    region: frankfurt
    branch: main
    dockerfilePath: ./services/video-worker/Dockerfile
    dockerContext: ./services/video-worker
    healthCheckPath: /readyz
    envVars:
      - key: NODE_ENV
        value: production
      - key: WORKER_ID
        value: render-free-1
      - key: WORKER_WAKE_SECRET
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_TRANSCRIPTION_MODEL
        value: whisper-large-v3-turbo
      - key: OPENAI_TRANSCRIPTION_MODEL
        value: gpt-4o-mini-transcribe
      - key: OPENROUTER_API_KEY
        sync: false
      - key: OPENROUTER_CLIP_MODEL
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_OAUTH_TOKEN_ENCRYPTION_KEY
        sync: false
      - key: CONNECTOR_TOKEN_ENCRYPTION_KEY
        sync: false
      - key: META_APP_ID
        sync: false
      - key: META_APP_SECRET
        sync: false
      - key: META_GRAPH_VERSION
        value: v25.0
      - key: TIKTOK_CLIENT_KEY
        sync: false
      - key: TIKTOK_CLIENT_SECRET
        sync: false
      - key: TIKTOK_CONTENT_POSTING_AUDITED
        value: "false"
      - key: LINKEDIN_CLIENT_ID
        sync: false
      - key: LINKEDIN_CLIENT_SECRET
        sync: false
      - key: LINKEDIN_API_VERSION
        value: "202605"
      - key: QUEUE_POLL_INTERVAL_MS
        value: "1500"
      - key: TASK_VISIBILITY_TIMEOUT_SECONDS
        value: "180"
      - key: MAX_DIRECT_DOWNLOAD_BYTES
        value: "2147483648"
      - key: DIRECT_DOWNLOAD_CONNECT_TIMEOUT_MS
        value: "10000"
      - key: DIRECT_DOWNLOAD_READ_TIMEOUT_MS
        value: "300000"
      - key: DIRECT_DOWNLOAD_REDIRECT_LIMIT
        value: "4"
      - key: YTDLP_PROXY_URL
        sync: false
      - key: ENABLE_EMBEDDED_WARP
        value: "true"
      - key: WARP_POOL_SIZE
        value: "2"
      - key: WARP_POOL_BASE_PORT
        value: "8080"
      - key: WARP_POOL_MIN_HEALTHY
        value: "1"
      - key: YTDLP_PROXY_PROBE_TIMEOUT_MS
        value: "15000"
      - key: YTDLP_STARTUP_PROBE
        value: "true"
      - key: YTDLP_SLEEP_INTERVAL_SECONDS
        value: "5"
      - key: YTDLP_MAX_SLEEP_INTERVAL_SECONDS
        value: "10"
      - key: YTDLP_REQUEST_SLEEP_INTERVAL_SECONDS
        value: "1"
      - key: PYTHON_ACQUISITION_REQUIRED
        value: "true"
      - key: PYTHON_ACQUISITION_URL
        value: http://127.0.0.1:8090
      - key: PYTHON_ACQUISITION_PORT
        value: "8090"
      - key: COBALT_API_URL
        fromService:
          type: web
          name: vidrial-cobalt
          envVarKey: RENDER_EXTERNAL_URL
      - key: COBALT_API_KEY
        fromService:
          type: web
          name: vidrial-cobalt
          envVarKey: COBALT_API_KEY
      - key: COBALT_REQUEST_TIMEOUT_MS
        value: "90000"
      - key: FFMPEG_THREADS
        value: "1"
      - key: LOG_LEVEL
        value: info
